name: samba_air
description: "Samba Air — Professional multi-transport camera app for SAMBA"
version: 0.6.0+6

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # WebRTC — WHIP protocol (phone → VortexEngine)
  flutter_webrtc: ^1.4.1

  # HTTP — WHIP signaling POST
  http: ^1.2.0

  # State management
  provider: ^6.1.2

  # Settings persistence (last-used engine IP, camera name)
  shared_preferences: ^2.2.3

  # QR scanner — ZXing C++/FFI, no ML Kit (avoids NPE on some devices)
  flutter_zxing: ^1.6.1

  # Permissions
  permission_handler: ^11.3.1

  # Local log file (shipped to the PC for analysis)
  path_provider: ^2.1.3

  # UI
  cupertino_icons: ^1.0.6

  # Studio modes (camera → phone switcher, switcher) — ex SAMBA Móvil Studio
  samba_protocol:
    path: packages/samba_protocol
  web_socket_channel: ^3.0.0   # room control channel (camera ↔ switcher)
  shelf: 1.4.1                 # switcher: local room server (:8088)
  shelf_web_socket: ^2.0.0
  qr_flutter: ^4.1.0           # switcher: pairing QR

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon_samba.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true

  # Inter — la tipografía de SAMBA (las mismas fuentes que ASSETS/fonts del escritorio). SIL Open Font License 1.1.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    # Phosphor Icons (Light) — MIT. Used through lib/theme/sd_icons.dart.
    - family: PhosphorLight
      fonts:
        - asset: assets/fonts/Phosphor-Light.ttf
